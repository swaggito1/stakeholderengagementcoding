      - code: INST_CERTIFICATION
        col: 16
        rule: >
          Certification, accreditation, or conformance assessment for
          quantum-safe products or implementations.
        threshold: >
          Must reference a formal certification process, conformance
          scheme, or named evaluation framework.
        disqualify: >
          Self-declaration or marketing claims of quantum-safety without
          third-party assessment or formal scheme reference.
        threshold_regex: "\\b(certif(ied|ication|icate)|accreditat|Common\\s+Criteria|CAVP|CMVP|FIPS\\s*140|conformance|validat(ed|ion)|protection\\s+profile|security\\s+target|EAL|SOG.IS|CSPN|mutual\\s+recognition|approved\\s+(product|list)|qualified\\s+(solution|product)|test\\s+laborator|assurance\\s+level|evaluation\\s+(scheme|facility|lab)|certification\\s+testing)\\b"
