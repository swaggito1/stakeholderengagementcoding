      - code: INST_TRANSITION
        col: 18
        rule: >
          Structured pathway, roadmap, or migration framework for managing
          the quantum-safe transition, issued or endorsed by an institutional
          authority.
        threshold: >
          Must provide actionable migration steps or a structured transition
          pathway from or endorsed by an institutional authority.
        disqualify: >
          General awareness content; threat description without migration
          pathway; vendor-only guides without institutional backing or
          endorsement.
        threshold_regex: "\\b(roadmap|transition\\s+(plan|framework|pathway|status)|migration\\s+(framework|strategy|path|guide|checklist|plan|progress|milestone)|action\\s+plan|playbook|implementation\\s+(roadmap|guide)|crypto.agilit|maturity\\s+model|readiness\\s+level|step.by.step|progress\\s+report|scorecard|migration\\s+status|migration\\s+milestone|transition\\s+governance)\\b"
