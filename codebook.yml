      - code: INST_GOVERNANCE
        col: 15
        rule: >
          Identification of governance body or authority responsible for
          quantum-safe transition oversight, coordination, or enforcement.
        threshold: >
          Must name a specific body AND attribute a governance role
          (oversight, coordination, enforcement, compliance tracking).
        disqualify: >
          Mention of an organisation without attributing a governance
          function or role in the QSC transition.
        threshold_regex: "\\b(NIST|NSA|CISA|ONCD|OMB|CNSS|DISA|BSI|ANSSI|SGDSN|AIVD|NCSC|ENISA|NATO|NCIA|KISA|FSB|FSTEC|SCA|TC260|CAC|MIIT|governance|oversight|responsible\\s+authority|coordinating\\s+body|lead\\s+agency|competent\\s+authority|designated\\s+authority|national\\s+coordinator|inter.agency|task\\s+force|steering\\s+committee|compliance\\s+track|audit\\s+cycle|annual\\s+assessment)\\b"
