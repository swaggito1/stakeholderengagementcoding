      - code: INST_SCOPE
        col: 17
        rule: >
          Jurisdictional, sectoral, or system-level delimitation of where
          PQC institutionalisation applies.
        threshold: >
          Must specify the boundary of applicability — which sectors,
          jurisdictions, system types, or populations are covered.
        disqualify: >
          Documents that apply generally without delimiting scope;
          single-system technical descriptions without scope framing.
        threshold_regex: "\\b(government\\s+systems?|federal|defence\\s+sector|financial\\s+sector|telecom|energy\\s+(sector|grid|infrastructure)|healthcare|transport\\s+sector|cross.border|EU.wide|NATO.wide|member\\s+states?|public\\s+sector|private\\s+sector|supply\\s+chain\\s+scope|critical\\s+infrastructure|essential\\s+services|CNI|modular\\s+cryptograph|algorithm.agil|future.proof|applicabilit|jurisdict|sector\\s+coverage)\\b"
